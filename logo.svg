<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <defs>
    <linearGradient id="yarnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8929A"/>
      <stop offset="50%" stop-color="#C47B7B"/>
      <stop offset="100%" stop-color="#8A5E52"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crochet Hook Illustration -->
  <g transform="translate(18, 12) rotate(-28)">
    <!-- Hook shaft -->
    <path d="M 5 65 L 5 22 Q 5 10 12 10 Q 18 10 16 16 Q 14 20 8 20" 
          fill="none" stroke="#C47B7B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hook grip / ergonomic bamboo handle -->
    <rect x="1" y="32" width="8" height="38" rx="4" fill="#EAD7C5" stroke="#C47B7B" stroke-width="1.2"/>
    <!-- Cute thread wrap on hook -->
    <path d="M 2 44 Q 5 46 8 44 M 2 52 Q 5 54 8 52 M 2 60 Q 5 62 8 60" 
          stroke="#E8929A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Yarn Thread Looping Around -->
  <path d="M 38 42 C 50 18, 65 65, 80 48 C 95 35, 92 62, 105 45" 
        fill="none" stroke="#E8929A" stroke-width="2.5" stroke-dasharray="4,2.5" opacity="0.85"/>

  <!-- Crochet Little Daisy Left -->
  <g transform="translate(26, 24) scale(0.65)">
    <!-- Petals -->
    <ellipse cx="20" cy="8" rx="6" ry="9" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <ellipse cx="32" cy="20" rx="9" ry="6" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <ellipse cx="20" cy="32" rx="6" ry="9" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <ellipse cx="8" cy="20" rx="9" ry="6" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <ellipse cx="11" cy="11" rx="7" ry="7" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <ellipse cx="29" cy="11" rx="7" ry="7" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <ellipse cx="29" cy="29" rx="7" ry="7" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <ellipse cx="11" cy="29" rx="7" ry="7" fill="#FFFDF9" stroke="#E8929A" stroke-width="1.5"/>
    <!-- Center with stitched detail -->
    <circle cx="20" cy="20" r="7" fill="#F4CA64" stroke="#D19828" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="3" fill="#EAA816"/>
  </g>

  <!-- Brand Typography -->
  <text x="82" y="47" font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
        font-size="34" font-weight="700" letter-spacing="1.5" fill="#4A2E2B">
    MadeByMaa
  </text>

  <!-- Cute Mini Crochet Heart beside title -->
  <path d="M 276 34 C 276 31 273 28 269 28 C 265 28 263 32 263 32 C 263 32 261 28 257 28 C 253 28 250 31 250 34 C 250 40 263 48 263 48 C 263 48 276 40 276 34 Z" 
        fill="#C47B7B" stroke="#8A5E52" stroke-width="1.2"/>

  <!-- Tagline underneath with stitched motif -->
  <text x="86" y="66" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="11.5" font-weight="500" letter-spacing="3.2" fill="#8A5E52" text-transform="uppercase">
    Handmade with Love ♡
  </text>

  <!-- Subtle stitched underline -->
  <line x1="84" y1="74" x2="278" y2="74" stroke="#E8929A" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  
  <!-- Tiny leaf decorative accent -->
  <path d="M 284 72 C 288 68, 294 68, 296 74 C 290 75, 286 76, 284 72 Z" fill="#8FA882"/>
</svg>